<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リアルタイム株価モニター</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            background-color: #1a1a1b; /* 暗めの背景で見やすく */
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 { font-size: 1.5rem; margin-bottom: 25px; color: #00d4ff; }
        .monitor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .stock-box {
            background: #2d2d2e;
            border-radius: 8px;
            padding: 15px;
            border: 1px solid #444;
        }
        .stock-box h2 {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }
        .stock-code { color: #aaa; font-size: 0.9rem; }
        .chart-img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            background: #fff; /* 画像読み込み前後のチラつき防止 */
        }
        .refresh-note {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #888;
        }
    </style>
    <!-- 5分ごとにページを自動更新する設定 -->
    <meta http-equiv="refresh" content="300">
</head>
<body>

    <h1>株価リアルタイムモニタリング</h1>

    <div class="monitor-grid">
        <!-- フォーサイド -->
        <div class="stock-box">
            <h2><span>フォーサイド</span> <span class="stock-code">2330.T</span></h2>
            <img src="https://chart.yahoo.co.jp/?code=2330.T&tm=1d&type=l&log=off&size=m&over=m25,m75&add=v" alt="2330 株価" class="chart-img">
        </div>

        <!-- メディネット -->
        <div class="stock-box">
            <h2><span>メディネット</span> <span class="stock-code">2370.T</span></h2>
            <img src="https://chart.yahoo.co.jp/?code=2370.T&tm=1d&type=l&log=off&size=m&over=m25,m75&add=v" alt="2370 株価" class="chart-img">
        </div>

        <!-- インスペック -->
        <div class="stock-box">
            <h2><span>インスペック</span> <span class="stock-code">6656.T</span></h2>
            <img src="https://chart.yahoo.co.jp/?code=6656.T&tm=1d&type=l&log=off&size=m&over=m25,m75&add=v" alt="6656 株価" class="chart-img">
        </div>

        <!-- ニプロ -->
        <div class="stock-box">
            <h2><span>ニプロ</span> <span class="stock-code">8086.T</span></h2>
            <img src="https://chart.yahoo.co.jp/?code=8086.T&tm=1d&type=l&log=off&size=m&over=m25,m75&add=v" alt="8086 株価" class="chart-img">
        </div>
    </div>

    <p class="refresh-note">
        ※画像はYahoo!ファイナンスの1日チャートを表示しています。<br>
        ※このページは5分ごとに自動更新されます（ブラウザの再読み込みでも最新化されます）。
    </p>

</body>
</html>
