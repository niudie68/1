<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注視銘柄 株価モニタ</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { color: #333; margin-bottom: 30px; }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }
        .stock-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 15px;
            text-align: center;
        }
        .stock-card h2 {
            font-size: 1.2rem;
            margin-top: 0;
            color: #555;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        iframe {
            border: none;
            width: 100%;
            height: 220px; /* ウィジェットの高さに合わせて調整 */
        }
    </style>
</head>
<body>

    <h1>株式リアルタイム監視</h1>

    <div class="grid-container">
        <!-- フォーサイド -->
        <div class="stock-card">
            <h2>フォーサイド (2330)</h2>
            <iframe src="https://www.google.com/finance/quote/2330:TYO"></iframe>
        </div>

        <!-- メディネット -->
        <div class="stock-card">
            <h2>メディネット (2370)</h2>
            <iframe src="https://www.google.com/finance/quote/2370:TYO"></iframe>
        </div>

        <!-- インスペック -->
        <div class="stock-card">
            <h2>インスペック (6656)</h2>
            <iframe src="https://www.google.com/finance/quote/6656:TYO"></iframe>
        </div>

        <!-- ニプロ -->
        <div class="stock-card">
            <h2>ニプロ (8086)</h2>
            <iframe src="https://www.google.com/finance/quote/8086:TYO"></iframe>
        </div>
    </div>

    <p style="margin-top: 20px; color: #888; font-size: 0.8rem;">
        ※Google Financeのデータに基づきます。表示には数分のディレイがある場合があります。
    </p>

</body>
</html>
